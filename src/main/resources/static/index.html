<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>人员旅行数据查询统计系统</title>
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="/lib/layui/css/layui.css">
    <link rel="stylesheet" href="/css/app.css">
</head>
<body>

<div class="layui-layout layui-layout-admin">

    <!-- 顶部 Header -->
    <header class="app-header">
        <div class="app-logo">
            <i class="layui-icon layui-icon-component"></i>
            <span>人员旅行数据系统</span>
        </div>
        <div class="app-header-right">
            <i class="layui-icon layui-icon-date"></i>
            <span id="headerClock"></span>
        </div>
    </header>

    <!-- 左侧菜单 -->
    <aside class="app-sidebar">
        <nav class="side-menu">
            <a class="side-menu-item active" href="javascript:;" data-panel="query" onclick="switchPanel('query')">
                <i class="layui-icon layui-icon-search"></i><span>查询统计</span>
            </a>
            <a class="side-menu-item" href="javascript:;" data-panel="conditions" onclick="switchPanel('conditions')">
                <i class="layui-icon layui-icon-list"></i><span>区间管理</span>
            </a>
        </nav>
    </aside>

    <!-- 内容区 -->
    <main class="app-content">

        <!-- 查询统计面板 -->
        <section id="queryPanel" class="panel">
            <div class="app-card">
                <div class="card-header">
                    <i class="layui-icon layui-icon-search"></i>
                    <span class="card-title">查询统计</span>
                </div>

                <div class="card-body">
                    <!-- 查询模式 Tab -->
                    <div class="layui-tab layui-tab-brief app-tab" lay-filter="modeTab">
                        <ul class="layui-tab-title">
                            <li class="layui-this" data-mode="age">按年龄查询</li>
                            <li data-mode="mileage">按飞行里程查询</li>
                            <li data-mode="time">按飞行时间查询</li>
                        </ul>
                        <div class="layui-tab-content">
                            <div class="layui-tab-item layui-show">
                                <div class="range-list" id="ageRangeRows"></div>
                                <div class="range-actions">
                                    <button type="button" class="btn-dashed" onclick="addRangeRow('ageRangeRows')">
                                        <i class="layui-icon layui-icon-add-1"></i>添加年龄段
                                    </button>
                                    <span class="range-tip">多个年龄段允许重叠</span>
                                </div>
                            </div>
                            <div class="layui-tab-item">
                                <div class="range-list" id="mileageRangeRows"></div>
                                <div class="range-actions">
                                    <button type="button" class="btn-dashed" onclick="addRangeRow('mileageRangeRows')">
                                        <i class="layui-icon layui-icon-add-1"></i>添加里程区间
                                    </button>
                                    <span class="range-tip">多个里程区间允许重叠</span>
                                </div>
                            </div>
                            <div class="layui-tab-item">
                                <div class="range-list" id="timeRangeRows"></div>
                                <div class="range-actions">
                                    <button type="button" class="btn-dashed" onclick="addRangeRow('timeRangeRows')">
                                        <i class="layui-icon layui-icon-add-1"></i>添加时间区间
                                    </button>
                                    <span class="range-tip">时间区间不允许重叠</span>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- 操作栏 -->
                    <div class="query-toolbar">
                        <div class="toolbar-left">
                            <span class="toolbar-label">已保存区间</span>
                            <div class="layui-form cond-select">
                                <select id="savedConditionSelect" lay-filter="savedConditionSelect"
                                        onchange="onSavedConditionSelect(this.value)">
                                    <option value="">选择已保存区间...</option>
                                </select>
                            </div>
                            <button type="button" class="btn btn-primary" id="btnQuery" onclick="doQuery()">
                                <i class="layui-icon layui-icon-search"></i>查询
                            </button>
                            <button type="button" class="btn btn-outline" id="btnSave" onclick="saveCondition()">
                                <i class="layui-icon layui-icon-ok"></i>保存当前区间
                            </button>
                        </div>
                        <div class="toolbar-right">
                            <span class="toolbar-label">展示方式</span>
                            <div class="seg-group">
                                <button type="button" class="seg-item active" data-type="list" onclick="switchView('list')">列表</button>
                                <button type="button" class="seg-item" data-type="bar" onclick="switchView('bar')">柱状图</button>
                                <button type="button" class="seg-item" data-type="pie" onclick="switchView('pie')">饼图</button>
                                <button type="button" class="seg-item" data-type="line" onclick="switchView('line')">折线图</button>
                            </div>
                        </div>
                    </div>

                    <!-- 结果区 -->
                    <div class="table-wrap" id="listBox">
                        <table id="personTable" lay-filter="personTable"></table>
                    </div>
                    <div id="chartBox" class="chart-box"></div>
                </div>
            </div>
        </section>

        <!-- 区间管理面板 -->
        <section id="conditionsPanel" class="panel" style="display:none;">
            <div class="app-card">
                <div class="card-header">
                    <i class="layui-icon layui-icon-list"></i>
                    <span class="card-title">区间管理</span>
                </div>

                <div class="card-body">
                    <div class="cond-toolbar">
                        <span class="cond-count" id="condCount">共 0 条记录</span>
                        <button type="button" class="btn btn-primary" id="btnNewCond" style="visibility:hidden;">
                            <i class="layui-icon layui-icon-add-1"></i>新建区间
                        </button>
                    </div>
                    <div class="table-wrap">
                        <table id="condTable" lay-filter="condTable"></table>
                    </div>
                </div>
            </div>
        </section>

    </main>
</div>

<script type="text/html" id="opTpl">
    <a class="link-btn" lay-event="load">加载</a>
    <a class="link-btn link-btn-danger" lay-event="del">删除</a>
</script>

<script src="/lib/layui/layui.js"></script>
<script src="/lib/echarts/echarts.min.js"></script>
<script src="/js/api.js"></script>
<script src="/js/app.js"></script>
<script src="/js/range.js"></script>
<script src="/js/chart.js"></script>
<script src="/js/query.js"></script>
<script src="/js/conditions.js"></script>
</body>
</html>
